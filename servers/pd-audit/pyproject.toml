[project]
name = "pd-audit-mcp"
version = "0.1.0"
description = "Servidor MCP para auditar y limpiar datasets JSONL de Pure Data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
pd-audit-mcp = "pd_audit.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["pd_audit"]
